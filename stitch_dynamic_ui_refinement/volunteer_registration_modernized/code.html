<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Volunteer Registration</title>
<!-- Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#2D5BD7', // Updated to new vibrant Indigo
            primaryDark: '#1a41a8',
            accent: '#0EA5E9', // Sky Blue for Pilgrim context
            surface: '#fdfdff', // Updated soft blue tinted surface
            textMain: '#1e293b',
            textMuted: '#475569',
            border: '#e2e8f0',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' },
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styles">
    body {
      background-color: #fdfdff; /* Updated soft blue tinted surface */
    }
    
    /* Staggered animation classes */
    .stagger-1 { animation-delay: 0.1s; opacity: 0; }
    .stagger-2 { animation-delay: 0.2s; opacity: 0; }
    .stagger-3 { animation-delay: 0.3s; opacity: 0; }
    .stagger-4 { animation-delay: 0.4s; opacity: 0; }
    
    /* Shimmer effect for button */
    .btn-shimmer {
      background: linear-gradient(to right, #2D5BD7 4%, #5b82e8 25%, #2D5BD7 36%);
      background-size: 1000px 100%;
    }
    
    /* Custom checkbox styling for Skills section */
    .skill-checkbox:checked + div {
      border-color: #2D5BD7;
      background-color: #eff6ff;
    }
  </style>
</head>
<body class="text-textMain font-sans antialiased min-h-screen flex flex-col pb-16 bg-surface">
<!-- BEGIN: MainHeader -->
<header class="bg-white border-b border-border px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-sm">
<div class="flex items-center gap-2">
<!-- App Icon -->
<svg fill="none" height="20" stroke="#2D5BD7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20">
<rect height="7" width="7" x="3" y="3"></rect>
<rect height="7" width="7" x="14" y="3"></rect>
<rect height="7" width="7" x="14" y="14"></rect>
<rect height="7" width="7" x="3" y="14"></rect>
</svg>
<span class="font-bold text-primary text-sm tracking-wider">CROWDGRID</span>
</div>
<button class="bg-primary hover:bg-primaryDark text-white text-sm font-medium py-1.5 px-4 rounded-lg transition-colors">
      IRCTC Login
    </button>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 py-6 max-w-lg mx-auto w-full">
<!-- Header Text -->
<div class="mb-6 animate-fade-in-up stagger-1">
<h1 class="text-[17px] font-medium mb-1.5">Volunteer Registration</h1>
<p class="text-[15px] text-textMuted leading-snug">Join our network to assist pilgrims during their journey.</p>
</div>
<!-- Form Container (Level 1 Card) -->
<div class="bg-white border border-border rounded-xl shadow-sm p-4 animate-fade-in-up stagger-2">
<form class="space-y-8">
<!-- SECTION: Personal Information -->
<section class="space-y-4">
<h2 class="text-[15px] text-textMain border-b border-border pb-2">Personal Information</h2>
<div class="space-y-4">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] text-textMuted" for="fullName">Full Name</label>
<input class="w-full border-border rounded-lg px-3 py-2.5 text-[15px] focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-shadow placeholder:text-gray-400" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] text-textMuted" for="phone">Phone Number</label>
<input class="w-full border-border rounded-lg px-3 py-2.5 text-[15px] focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-shadow tabular-nums" id="phone" type="tel" value="+91"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] text-textMuted" for="email">Email Address</label>
<input class="w-full border-border rounded-lg px-3 py-2.5 text-[15px] focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-shadow placeholder:text-gray-400" id="email" placeholder="Optional" type="email"/>
</div>
</div>
</section>
<!-- SECTION: Availability -->
<section class="space-y-4 animate-fade-in-up stagger-3">
<h2 class="text-[15px] text-textMain border-b border-border pb-2">Availability</h2>
<div class="space-y-4">
<!-- Duration -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] text-textMuted" for="duration">Duration of Stay (Days)</label>
<div class="relative">
<select class="w-full border-border rounded-lg px-3 py-2.5 text-[15px] appearance-none focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-shadow bg-white text-textMain" id="duration">
<option disabled="" selected="" value="">Select duration</option>
<option value="1-3">1-3 Days</option>
<option value="4-7">4-7 Days</option>
<option value="7+">More than 7 Days</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
<!-- Preferred Zone -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] text-textMuted">Preferred Zone</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center gap-2 border border-border rounded-lg p-3 cursor-pointer hover:border-gray-300 transition-colors">
<input class="text-primary focus:ring-primary w-4 h-4 border-gray-300" name="zone" type="radio" value="base-camp"/>
<span class="text-[14px]">Base Camp</span>
</label>
<label class="flex items-center gap-2 border border-border rounded-lg p-3 cursor-pointer hover:border-gray-300 transition-colors">
<input class="text-primary focus:ring-primary w-4 h-4 border-gray-300" name="zone" type="radio" value="transit-route"/>
<span class="text-[14px]">Transit Route</span>
</label>
</div>
</div>
</div>
</section>
<!-- SECTION: Skills & Expertise -->
<section class="space-y-4 animate-fade-in-up stagger-4">
<div class="border-b border-border pb-2 mb-2">
<h2 class="text-[15px] text-textMain">Skills &amp; Expertise</h2>
</div>
<p class="text-[14px] text-textMuted mb-3">Select any areas where you can provide assistance.</p>
<div class="space-y-3">
<!-- Skill: First Aid -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only skill-checkbox" name="skills" type="checkbox" value="first-aid"/>
<div class="border border-border rounded-lg p-3.5 transition-colors hover:border-gray-300 flex items-start gap-3">
<div class="w-4 h-4 border border-gray-300 rounded mt-0.5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center bg-white transition-colors">
<svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<div>
<div class="text-[14px] font-medium text-textMain">First Aid</div>
<div class="text-[13px] text-textMuted">Medical assistance</div>
</div>
</div>
</label>
<!-- Skill: Logistics -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only skill-checkbox" name="skills" type="checkbox" value="logistics"/>
<div class="border border-border rounded-lg p-3.5 transition-colors hover:border-gray-300 flex items-start gap-3">
<div class="w-4 h-4 border border-gray-300 rounded mt-0.5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center bg-white transition-colors">
<svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<div>
<div class="text-[14px] font-medium text-textMain">Logistics</div>
<div class="text-[13px] text-textMuted">Crowd control &amp; routing</div>
</div>
</div>
</label>
<!-- Skill: Translation -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only skill-checkbox" name="skills" type="checkbox" value="translation"/>
<div class="border border-border rounded-lg p-3.5 transition-colors hover:border-gray-300 flex items-start gap-3">
<div class="w-4 h-4 border border-gray-300 rounded mt-0.5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center bg-white transition-colors">
<svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<div>
<div class="text-[14px] font-medium text-textMain">Translation</div>
<div class="text-[13px] text-textMuted">Multi-lingual support</div>
</div>
</div>
</label>
<!-- Skill: Information -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only skill-checkbox" name="skills" type="checkbox" value="information"/>
<div class="border border-border rounded-lg p-3.5 transition-colors hover:border-gray-300 flex items-start gap-3">
<div class="w-4 h-4 border border-gray-300 rounded mt-0.5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center bg-white transition-colors">
<svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<div>
<div class="text-[14px] font-medium text-textMain">Information</div>
<div class="text-[13px] text-textMuted">Guiding pilgrims</div>
</div>
</div>
</label>
</div>
</section>
<!-- Submit Button -->
<div class="pt-4 border-t border-border mt-6">
<button class="w-full btn-shimmer animate-shimmer text-white font-medium rounded-lg py-3 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" type="button">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18">
<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
<circle cx="9" cy="7" r="4"></circle>
<line x1="19" x2="19" y1="8" y2="14"></line>
<line x1="22" x2="16" y1="11" y2="11"></line>
</svg>
            Submit Registration
          </button>
</div>
</form>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<nav class="bg-white border-t border-border fixed bottom-0 w-full flex justify-around items-center pb-safe pt-2 px-2 pb-2 z-10">
<a class="flex flex-col items-center gap-1 text-accent" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
<span class="text-[12px] font-medium">Pilgrim</span>
</a>
<a class="flex flex-col items-center gap-1 text-textMuted hover:text-textMain" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24">
<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
<circle cx="9" cy="7" r="4"></circle>
<path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
</svg>
<span class="text-[12px]">Gathering</span>
</a>
<a class="flex flex-col items-center gap-1 text-textMuted hover:text-textMain" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24">
<rect height="14" rx="2" ry="2" width="20" x="2" y="7"></rect>
<path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
</svg>
<span class="text-[12px]">Corporate</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</body></html>
